name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes for a manual patch release"
        required: true
        type: string
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Compute next version
        id: ver
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "VERSION must be MAJOR.MINOR, got '$base'"; exit 1; }
          last=$(git tag --list "v${base}.*" --sort=-v:refname | head -1)
          patch=$(( ${last:+${last##*.} + 1} + 0 ))
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          RELEASE_NOTES: ${{ inputs.notes || github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash .github/scripts/release-notes.sh "$VERSION" "$RELEASE_NOTES" "$PR_NUMBER" > "$RUNNER_TEMP/notes.md"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm pkg set version="$VERSION"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p out/SpoutRemotePlay
          cp -r dist py_modules main.py plugin.json package.json LICENSE out/SpoutRemotePlay/
          (cd out && zip -qr "../SpoutRemotePlay-v${VERSION}.zip" SpoutRemotePlay)

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" "SpoutRemotePlay-v${VERSION}.zip" \
            --target "$RELEASE_SHA" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
